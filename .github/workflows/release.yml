name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Flatpak bundle
    # Not in a container: flatpak-builder uses bubblewrap to sandbox the
    # build, and a container blocks the nested user namespaces it needs.
    # The runner is a virtual machine, so it works there.
    runs-on: ubuntu-latest
    env:
      APP_ID: com.sparkybin.Browser
      MANIFEST: com.sparkybin.Browser.json
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists --system flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --system flathub \
            org.gnome.Sdk//51 org.gnome.Platform//51

      - name: Pin the manifest to this commit
        run: |
          python3 .github/scripts/pin-manifest.py \
            "$MANIFEST" stable.json "$GITHUB_SHA"

      - name: Build the flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --repo=repo flatpak-build stable.json
          flatpak build-bundle repo \
            "sparkybin-browser-${GITHUB_REF_NAME}.flatpak" "$APP_ID"

      - name: Write the release notes
        run: |
          python3 .github/scripts/release-notes.py "$GITHUB_REF_NAME" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "sparkybin-browser-${GITHUB_REF_NAME}.flatpak" \
            --title "SparkyBin Browser $GITHUB_REF_NAME" \
            --notes-file notes.md

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build-log
          path: flatpak-build/.flatpak-builder/
          retention-days: 7
